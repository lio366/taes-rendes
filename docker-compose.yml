services:
  taes:
    build: .
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: postgresql://taes:taes@postgres:5432/taes
      REDIS_URL: redis://redis:6379/0
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taes
      POSTGRES_PASSWORD: taes
      POSTGRES_DB: taes
    volumes:
      - taes_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  taes_pg:
